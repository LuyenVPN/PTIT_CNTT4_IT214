spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: roomtype-service
              uri: lb://roomtype-service
              predicates:
                - Path=/api/roomtype/**
              filters:
                - StripPrefix=2

            - id: room-service
              uri: lb://room-service
              predicates:
                - Path=/api/room/**
              filters:
                - StripPrefix=2
server:
  port: 8080
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      default-zone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

