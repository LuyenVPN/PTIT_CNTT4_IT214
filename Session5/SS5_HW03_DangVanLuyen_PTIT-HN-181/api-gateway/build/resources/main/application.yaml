server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: product-route
              uri: lb://product-service
              predicates:
                - Path=/products, /products/**
      mvc:
        routes:
          - id: product-route-fallback
            uri: lb://product-service
            predicates:
              - Path=/products, /products/**
    discovery:
      client:
        simple:
          instances:
            product-service:
              - uri: http://localhost:8081
              - uri: http://localhost:8082